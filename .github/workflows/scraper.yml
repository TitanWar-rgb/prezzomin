name: PrezzoMin Amazon Monitor

on:
  schedule:
    # Esegue ogni 30 minuti (a minuto :00 e :30 di ogni ora)
    - cron: '*/30 * * * *'
  # Permette di avviare o testare la scansione manualmente dall'interfaccia web di GitHub
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Invia il messaggio di avvio su Telegram (test dei secret)'
        type: boolean
        default: false

concurrency:
  group: prezzomin-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        category:
          - notebook
          - hardware_pc
          - smartphones
          - warehouse_tech
          - warehouse_mobile
          - monitors_tv
          - gaming_periferiche
          - storage_network
          - audio_wearable
          - smart_home

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installa Chromium per Playwright
        run: |
          playwright install --with-deps chromium

      # Cloudflare WARP SOCKS5 per mascherare l'IP di Azure ed evitare blocchi
      - name: Avvia Cloudflare WARP (proxy SOCKS5 locale)
        id: warp
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q
          sudo apt-get install -y -q cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if curl -s --max-time 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "WARP connesso"
              echo "PROXY_URL=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::WARP non connesso, proseguo con IP diretto"
          exit 1

      - name: Esegui sessione di monitoraggio (${{ matrix.category }} - 27 minuti)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATEGORY: ${{ matrix.category }}
          RUN_MINUTES: 27
          SEND_STARTUP_MSG: ${{ inputs.test_telegram && 'true' || 'false' }}
        run: |
          python main.py

      - name: Salva database storico (${{ matrix.category }})
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/worker_${{ matrix.category }}.db || echo "Nessun db da aggiungere"
          git commit -m "Aggiorna storico ASIN ${{ matrix.category }} [skip ci]" || echo "Nessun nuovo prodotto da salvare"
          # Loop di rebase per gestire i salvataggi concorrenti dei 10 worker
          for attempt in $(seq 1 10); do
            git pull --rebase --autostash origin main && git push && exit 0 || sleep $((RANDOM % 10 + 3))
          done
          echo "Impossibile pushare il database dopo 10 tentativi"
